[package]
name = "skini"
version = "0.1.0"
edition = "2024"
description = "Skini Desktop — Apple Wallet card-skin applier (fork of AirCard, MIT)"
license = "MIT"

[[bin]]
name = "skini"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
eframe = { version = "0.33", default-features = true }
egui = "0.33"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.8"
miniz_oxide = "0.8"
plist = "1"
regex = "1"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"

# macOS: the bridge passes the Studio through from the real site (Safari blocks the site from reaching 127.0.0.1).
[target.'cfg(target_os = "macos")'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
